# Telaris versioned-asset rule — REQUIRED.
#
# Path-based versioning is what makes Safari's ES module cache reliably refetch
# JS modules between releases (Safari ignores ?v= query strings for module dedup).
# inc/bootstrap.php probes this rule once per app version; if the probe fails,
# every page renders a red warning banner with this snippet inlined.
#
# Drop this block inside your existing `server { ... }` for the Telaris vhost,
# replacing the alias path with your actual document root, then run:
#   sudo nginx -t && sudo systemctl reload nginx

location ~ ^/js/v[0-9]+\.[0-9]+\.[0-9]+/(.+\.js)$ {
    alias /var/www/YOUR-DOCROOT/js/$1;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # add_header inheritance is broken once a location declares its own,
    # so repeat the security headers from the server block here:
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
