<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <!-- Background Circle -->
      <circle cx="50" cy="50" r="40" fill="#FF5500" />
      
      <!-- Horizontal Glitch Slices -->
      <rect x="5" y="20" width="90" height="8" fill="#5500FF">
        <animate attributeName="x" values="5;10;-5;5" duration="0.12s" repeatCount="indefinite" />
      </rect>
      <rect x="5" y="70" width="90" height="4" fill="white">
        <animate attributeName="x" values="5;0;10;5" duration="0.08s" repeatCount="indefinite" />
      </rect>
      
      <!-- Pattern Element -->
      <g stroke="black" stroke-width="6" fill="none">
        <path d="M20,50 L80,50 M50,20 L50,80" />
      </g>

      <!-- Noise bits -->
      <rect x="15" y="15" width="8" height="8" fill="black" />
      <rect x="77" y="77" width="8" height="8" fill="white" />
    </svg>