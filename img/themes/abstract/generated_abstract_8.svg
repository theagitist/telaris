<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <!-- Solid Background Circle -->
      <circle cx="50" cy="50" r="40" fill="#FF00FF" />
      
      <!-- Offset "Glitch" Slices -->
      <rect x="10" y="30" width="80" height="10" fill="#FF0055">
        <animate attributeName="x" values="10;15;5;10" duration="0.15s" repeatCount="indefinite" />
      </rect>
      <rect x="10" y="60" width="80" height="5" fill="white">
        <animate attributeName="x" values="10;8;12;10" duration="0.1s" repeatCount="indefinite" />
      </rect>
      
      <!-- Foreground Geometric Element -->
      <g stroke="black" stroke-width="4" fill="none">
        <path d="M30,30 L70,70 M70,30 L30,70" stroke-width="8" />
      </g>

      <!-- Sharp secondary glitch blocks -->
      <rect x="20" y="20" width="10" height="10" fill="white" />
      <rect x="70" y="70" width="10" height="10" fill="black" />
    </svg>