; Telaris runtime PHP settings. Upload caps match nginx client_max_body_size
; (55m). Large media optimization raises its own time limit via set_time_limit.
upload_max_filesize = 55M
post_max_size = 60M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
