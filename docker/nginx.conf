# Telaris nginx server (container). Adapted from etc/nginx/telaris-vhost.conf.template:
# php-fpm reached over TCP (app:9000) instead of a unix socket, and TLS is
# terminated upstream (Caddy or the operator's own reverse proxy), so this
# server speaks plain HTTP on :80 with server_name _.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- deny source/config ---
    location ~ /\.        { deny all; return 404; }
    location ~* \.(sql|md|sh|yml|yaml|ini|log|bak|swp)$ { deny all; return 404; }
    location ~* ^/(config\.php|config_default\.php|VERSION|SCHEMA\.sql|CLAUDE\.md|composer\.(json|lock)|Dockerfile|docker-compose\.yml)$ { deny all; return 404; }

    # --- uploaded media served via PHP (files live outside the doc root) ---
    location /uploads/ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/serve-upload.php;
        include fastcgi_params;
    }

    # --- REQUIRED: versioned static JS (/js/vX.Y.Z/foo.js -> /js/foo.js) ---
    # Without this, ES modules fall through to index.php, return text/html, and
    # nosniff makes the browser refuse them: the 3D scene never boots.
    location ~ ^/js/v[0-9]+\.[0-9]+\.[0-9]+/(.+\.js)$ {
        alias /var/www/html/js/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # --- hotglue wormhole media (vendored GPL fork served under /hg/) ---
    # Container equivalent of etc/nginx/telaris-hotglue.conf.sample, with php-fpm
    # over TCP (app:9000). hotglue serves every page AND uploaded media through
    # its single front controller, so the flat-file content store is denied
    # outright and only index.php/json.php may execute; editing is gated by the
    # Telaris auth bridge (hg/telaris-auth.inc.php), never by hotglue's own auth.
    location ^~ /hg/ {
        location ^~ /hg/content/ {
            deny all;
            return 404;
        }
        location ~ ^/hg/(index|json)\.php$ {
            try_files $uri =404;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        location ~* ^/hg/.+\.php$ {
            deny all;
            return 404;
        }
        location ~* ^/hg/(COPYING|INSTALL|README|UPSTREAM\.md|htaccess-dist)$ {
            deny all;
            return 404;
        }
        try_files $uri /hg/index.php?$query_string;
    }
}
